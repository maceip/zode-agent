name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      release-tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist/release
      - name: Verify downloaded assets
        working-directory: dist/release
        run: sha256sum --check -- *.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/release/*.zip dist/release/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Alto $RELEASE_TAG" \
            --notes "macOS app for Apple Silicon. This build is ad-hoc signed and is not notarized by Apple." \
            --generate-notes \
            "${options[@]}"
